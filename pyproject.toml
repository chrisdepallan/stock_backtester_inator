[project]
name = "mbt"
version = "0.1.0"
description = "NSE short-term momentum backtest"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "pyarrow",
    "scipy",
    "matplotlib",
    "pydantic",
    "pyyaml",
    "typer",
]

[project.scripts]
mbt = "mbt.cli:app"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbt"]
